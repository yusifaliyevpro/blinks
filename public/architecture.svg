<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blinks encrypts your links in the browser, then stores the opaque blob in one of two backends: remotely in Redis via a server action, or locally in the browser's IndexedDB.">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { fill: #ececf0; font-size: 14px; font-weight: 600; }
    .t { fill: #ececf0; font-size: 13px; }
    .m { fill: #8b8b96; font-size: 11.5px; }
    .code { fill: #c7c7f2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .box { fill: #17171b; stroke: #2b2b31; }
    .acc { fill: #16162a; stroke: #6366f1; }
    .flow { stroke: #6f6f7c; stroke-width: 1.5; fill: none; }
    .flowa { stroke: #6366f1; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6f6f7c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6366f1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="624" rx="18" fill="#0a0a0c" stroke="#26262d"/>

  <!-- panels -->
  <rect fill="#0f0f13" stroke="#26262d" x="28" y="60" width="384" height="500" rx="14"/>
  <rect fill="#0f0f13" stroke="#26262d" x="492" y="60" width="180" height="250" rx="14"/>
  <rect fill="#0f0f13" stroke="#26262d" x="752" y="60" width="180" height="250" rx="14"/>
  <rect fill="#0f0f13" stroke="#6366f1" stroke-opacity="0.5" x="492" y="342" width="440" height="218" rx="14"/>

  <circle cx="48" cy="90" r="4" fill="#6366f1"/>
  <text class="h" x="62" y="94">Your browser</text>
  <circle cx="512" cy="90" r="4" fill="#6f6f7c"/>
  <text class="h" x="526" y="94">Server action</text>
  <circle cx="772" cy="90" r="4" fill="#6f6f7c"/>
  <text class="h" x="786" y="94">Redis</text>
  <text class="m" x="912" y="94" text-anchor="end">remote backend</text>
  <circle cx="512" cy="372" r="4" fill="#6366f1"/>
  <text class="h" x="526" y="376">IndexedDB</text>
  <text class="m" x="912" y="376" text-anchor="end">local backend</text>

  <!-- client: derive keys -->
  <rect class="box" x="60" y="116" width="320" height="42" rx="9"/>
  <text class="t" x="220" y="142" text-anchor="middle">password  +  public salt</text>
  <path class="flow" d="M220 158 L220 174" marker-end="url(#ah)"/>

  <rect class="box" x="94" y="176" width="252" height="46" rx="9"/>
  <text class="t" x="220" y="198" text-anchor="middle">Argon2id</text>
  <text class="m" x="220" y="214" text-anchor="middle">memory-hard KDF</text>
  <path class="flow" d="M220 222 L220 238" marker-end="url(#ah)"/>

  <rect class="box" x="94" y="240" width="252" height="42" rx="9"/>
  <text class="t" x="220" y="266" text-anchor="middle">master secret</text>
  <path class="flow" d="M220 282 L220 298" marker-end="url(#ah)"/>

  <rect class="box" x="94" y="300" width="252" height="42" rx="9"/>
  <text class="t" x="220" y="326" text-anchor="middle">HKDF-SHA256</text>

  <!-- three independent outputs -->
  <path class="flow" d="M206 342 L112 360" marker-end="url(#ah)"/>
  <path class="flow" d="M220 342 L220 360" marker-end="url(#ah)"/>
  <path class="flow" d="M234 342 L328 360" marker-end="url(#ah)"/>

  <rect class="acc" x="44" y="362" width="112" height="56" rx="9"/>
  <text class="t" x="100" y="386" text-anchor="middle">encKey</text>
  <text class="m" x="100" y="403" text-anchor="middle">never leaves</text>

  <rect class="box" x="164" y="362" width="112" height="56" rx="9"/>
  <text class="t" x="220" y="386" text-anchor="middle">blobId</text>
  <text class="m" x="220" y="403" text-anchor="middle">storage address</text>

  <rect class="box" x="284" y="362" width="112" height="56" rx="9"/>
  <text class="t" x="340" y="386" text-anchor="middle">writeToken</text>
  <text class="m" x="340" y="403" text-anchor="middle">write permit</text>

  <line x1="44" y1="444" x2="396" y2="444" stroke="#26262d" stroke-dasharray="3 5"/>
  <text class="m" x="220" y="466" text-anchor="middle">then encrypt your links</text>

  <rect class="box" x="44" y="480" width="352" height="46" rx="9"/>
  <text class="t" x="220" y="507" text-anchor="middle">gzip  →  AES-256-GCM ( encKey )</text>
  <text class="m" x="220" y="546" text-anchor="middle">the output is one opaque blob:  c · v · t</text>

  <!-- remote path: client to server -->
  <path class="flow" d="M412 300 L492 300" marker-end="url(#ah)"/>
  <text class="m" x="452" y="276" text-anchor="middle">blobId</text>
  <text class="m" x="452" y="291" text-anchor="middle">+ writeToken</text>
  <text class="m" x="452" y="318" text-anchor="middle">+ ciphertext</text>

  <!-- local path: client straight to IndexedDB (no server) -->
  <path class="flowa" d="M412 503 L452 503 L452 432 L492 432" marker-end="url(#aha)"/>
  <text class="m" x="466" y="522" text-anchor="middle">same blob</text>

  <!-- the choice -->
  <text class="m" x="452" y="356" text-anchor="middle" fill="#6366f1">or</text>

  <!-- server -->
  <rect class="box" x="508" y="118" width="148" height="40" rx="9"/>
  <text class="t" x="582" y="143" text-anchor="middle">validate (zod)</text>
  <path class="flow" d="M582 158 L582 172" marker-end="url(#ah)"/>

  <rect class="box" x="508" y="174" width="148" height="40" rx="9"/>
  <text class="t" x="582" y="199" text-anchor="middle">rate-limit per IP</text>
  <path class="flow" d="M582 214 L582 228" marker-end="url(#ah)"/>

  <rect class="box" x="508" y="230" width="148" height="54" rx="9"/>
  <text class="t" x="582" y="252" text-anchor="middle">compare-and-set</text>
  <text class="m" x="582" y="270" text-anchor="middle">atomic · checks token</text>

  <!-- server to redis -->
  <path class="flow" d="M672 204 L752 204" marker-end="url(#ah)"/>
  <text class="m" x="712" y="196" text-anchor="middle">atomic</text>
  <text class="m" x="712" y="222" text-anchor="middle">write</text>

  <!-- redis -->
  <rect class="box" x="772" y="132" width="140" height="150" rx="9"/>
  <text class="h" x="788" y="160">hash @ blobId</text>
  <text class="code" x="788" y="190">c</text>
  <text class="m" x="808" y="190">ciphertext</text>
  <text class="code" x="788" y="218">v</text>
  <text class="m" x="808" y="218">version</text>
  <text class="code" x="788" y="246">t</text>
  <text class="m" x="808" y="246">writeToken</text>

  <!-- local: IndexedDB -->
  <rect class="acc" x="512" y="402" width="150" height="140" rx="9"/>
  <text class="h" x="528" y="430">record @ blobId</text>
  <text class="code" x="528" y="460">c</text>
  <text class="m" x="548" y="460">ciphertext</text>
  <text class="code" x="528" y="488">v</text>
  <text class="m" x="548" y="488">version</text>
  <text class="code" x="528" y="516">t</text>
  <text class="m" x="548" y="516">writeToken</text>

  <text class="t" x="694" y="428">Written straight to your</text>
  <text class="t" x="694" y="446">browser by the same CAS.</text>
  <text class="m" x="694" y="472">No server, no network.</text>
  <text class="m" x="694" y="490">Works offline, stays on</text>
  <text class="m" x="694" y="508">this device. Same blob,</text>
  <text class="m" x="694" y="526">same version + token guard.</text>

  <!-- footer callout -->
  <rect x="28" y="576" width="904" height="44" rx="10" fill="#14142a" stroke="#6366f1" stroke-opacity="0.4"/>
  <text class="t" x="480" y="595" text-anchor="middle">The key is made in your browser and never leaves. Your encrypted blob is stored in whichever backend you pick:</text>
  <text class="t" x="480" y="613" text-anchor="middle">Redis on a server, or IndexedDB in this browser (offline). Either way it is only bytes that no one else can read.</text>
</svg>
